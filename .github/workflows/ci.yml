name: CI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every relative link in the documentation resolves
        run: bash scripts/check-doc-links.sh

  # The baseline's templates and the items that name them must agree: every
  # template an item names exists, every template is used, and every variable a
  # template uses is one the tool fills in.
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every template exists, is used and uses only known variables
        run: python3 scripts/check-baseline-templates.py

  # Releases are versioned from commit messages, so every commit a pull
  # request could land on main must be a conventional commit: each commit for
  # a rebase merge, and the pull request title for a squash merge.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/release.sh lint <<<"$TITLE"
      - name: Pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git log --no-merges --format=%s "$BASE..$HEAD" | scripts/release.sh lint
      - name: Pushed commit
        if: github.event_name == 'push'
        run: git log -1 --format=%s | scripts/release.sh lint

  # check-jsonschema is the reference validator the cases are graded with.
  # Pinned, because a validator that rewords an error would fail every case.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        contract: [manifest, gate-result, lock, baseline, baseline-answers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the reference validator
        run: pipx install check-jsonschema==0.33.0
      - name: The schema accepts and rejects what its cases say it must
        run: bash scripts/check-cases.sh "${{ matrix.contract }}"

  # The crate hands the schema and its cases to readers written in Rust.
  # rustup reads rust-toolchain.toml, so CI and a developer's machine install
  # the same compiler from the same file.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Formatted
        run: cargo fmt --all --check
      - name: Linted, warnings denied
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: The crate exposes every case file and what it states
        run: cargo test --locked

  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every skill is named for its directory and cites only what exists
        run: python3 scripts/check-skills.py

  # The repository must pass the baseline it defines. heph is the released
  # binary, pinned by version and by the SHA-256 GitHub reports for the asset, so
  # a replaced release fails here instead of running. It runs without --settings:
  # the workflow token cannot read the security settings or the rulesets, so a
  # person with admin access checks those.
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEPH_VERSION: v0.11.1
      HEPH_SHA256: b4f95464505c6a138e21c1ba8c3132345ac7d6b5178c200218676a82c1760a8c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install heph
        run: |
          archive="heph-${HEPH_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/erinversfeldcodes/hephaestium/releases/download/${HEPH_VERSION}/${archive}"
          echo "${HEPH_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive"
          install -m 0755 "heph-${HEPH_VERSION}-linux-x86_64/heph" /usr/local/bin/heph
      - name: The files and workflows satisfy the baseline
        run: heph baseline check

  ci:
    if: always()
    needs: [docs, commits, contracts, pack, rust, skills, baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every other job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a required job ended as: $result" >&2
              exit 1
            fi
          done
