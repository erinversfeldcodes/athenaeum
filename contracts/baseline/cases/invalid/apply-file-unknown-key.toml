# violates: $.items['community-readme'].apply.files[0] additionalProperties
# A misspelt key would be ignored, and the file would be written somewhere unintended.
schema_version = 0

[items.community-readme]
title = "A README"
kind = "file"
severity = "required"
check = { path_any = ["README.md"] }
apply = { files = [{ template = "README.md", destination = "README.md", overwrite = true }] }
