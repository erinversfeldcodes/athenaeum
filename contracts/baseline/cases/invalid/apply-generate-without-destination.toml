# violates: $.items['deps-y'].apply.generate required
# A generator says where its file is written.
schema_version = 0

[items.deps-y]
title = "Dependabot is configured"
kind = "file"
severity = "required"
check = { path_any = [".github/dependabot.yml"] }
apply = { generate = { generator = "dependabot" } }
