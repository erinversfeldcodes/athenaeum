# violates: $.items['community-readme'].apply.files[0].destination pattern
# A file is written inside the repository and nowhere else.
schema_version = 0

[items.community-readme]
title = "A README"
kind = "file"
severity = "required"
check = { path_any = ["README.md"] }
apply = { files = [{ template = "README.md", destination = "../README.md" }] }
