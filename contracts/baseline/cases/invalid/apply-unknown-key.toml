# violates: $.items['community-readme'].apply additionalProperties
# An apply has files and nothing else; another key would be ignored.
schema_version = 0

[items.community-readme]
title = "A README"
kind = "file"
severity = "required"
check = { path_any = ["README.md"] }
apply = { files = [{ template = "README.md", destination = "README.md" }], mode = "force" }
